name: Build and Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AnvilCore.slnx

      - name: Build
        run: dotnet build AnvilCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AnvilCore.slnx --configuration Release --no-build --verbosity normal
